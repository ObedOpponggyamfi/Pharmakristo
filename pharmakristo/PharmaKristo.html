<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1280, initial-scale=1"/>
  <title>PharmaKristo — Pharmacy Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
/* pk-style.css — PharmaKristo design system */
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pk-purple:       #2D1B69;
  --pk-purple-med:   #3D2780;
  --pk-purple-light: rgba(255,255,255,.08);
  --pk-green:        #16a34a;
  --pk-green-dark:   #15803d;
  --pk-green-light:  #dcfce7;
  --pk-blue:         #2563eb;
  --pk-blue-dark:    #1d4ed8;
  --pk-orange:       #d97706;
  --pk-orange-dark:  #b45309;
  --pk-red:          #dc2626;
  --pk-red-dark:     #b91c1c;
  --pk-gray-50:      #f9fafb;
  --pk-gray-100:     #f3f4f6;
  --pk-gray-200:     #e5e7eb;
  --pk-gray-300:     #d1d5db;
  --pk-gray-400:     #9ca3af;
  --pk-gray-500:     #6b7280;
  --pk-gray-600:     #4b5563;
  --pk-gray-700:     #374151;
  --pk-gray-900:     #111827;
  --pk-white:        #ffffff;
  --radius-sm:       6px;
  --radius-md:       10px;
  --radius-lg:       14px;
  --shadow-sm:       0 1px 3px rgba(0,0,0,.08);
  --shadow-md:       0 4px 12px rgba(0,0,0,.1);
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--pk-gray-100);
  color: var(--pk-gray-900);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ─── App shell ──────────────────────────────────────────────────────── */
.pk-app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ─── Sidebar ────────────────────────────────────────────────────────── */
.pk-sidebar {
  width: 228px;
  background: var(--pk-purple);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  overflow-y: auto;
}
.pk-sidebar::-webkit-scrollbar { width: 0; }

.pk-sidebar-brand {
  padding: 20px 16px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,.09);
}
.pk-sidebar-logo {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--pk-green);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.pk-brand-name {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
}
.pk-brand-sub {
  font-size: 11px;
  color: rgba(255,255,255,.55);
  font-weight: 400;
}

.pk-sidebar-nav {
  flex: 1;
  padding: 10px 8px 8px;
}
.pk-nav-section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  padding: 12px 12px 6px;
}
.pk-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,.72);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  transition: background .12s, color .12s;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.pk-nav-item:hover { background: rgba(255,255,255,.09); color: #fff; }
.pk-nav-item.active { background: var(--pk-green); color: #fff; font-weight: 600; }
.pk-nav-icon { width: 18px; height: 18px; flex-shrink: 0; }

.pk-sidebar-user {
  padding: 14px 16px;
  border-top: 1px solid rgba(255,255,255,.09);
  display: flex;
  align-items: center;
  gap: 10px;
}
.pk-user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--pk-green);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.pk-user-name { font-size: 13px; font-weight: 600; color: #fff; }
.pk-user-role { font-size: 11px; color: rgba(255,255,255,.5); }
.pk-logout {
  margin-left: auto;
  background: transparent;
  border: none;
  color: rgba(255,255,255,.5);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: flex;
}
.pk-logout:hover { color: #fff; }

/* ─── Main area ──────────────────────────────────────────────────────── */
.pk-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

/* ─── Header ─────────────────────────────────────────────────────────── */
.pk-header {
  height: 60px;
  background: var(--pk-white);
  border-bottom: 1px solid var(--pk-gray-200);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  flex-shrink: 0;
}
.pk-header-collapse {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--pk-gray-500);
  padding: 4px;
  border-radius: var(--radius-sm);
  display: flex;
}
.pk-header-collapse:hover { background: var(--pk-gray-100); }

.pk-pharmacy-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  border: 1px solid var(--pk-gray-200);
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--pk-gray-700);
  background: var(--pk-white);
}
.pk-pharmacy-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--pk-green);
}
.pk-branch-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border: 1px solid var(--pk-gray-200);
  border-radius: 20px;
  font-size: 13px;
  color: var(--pk-gray-600);
  cursor: pointer;
  background: var(--pk-white);
}

.pk-search {
  flex: 1;
  max-width: 400px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  background: var(--pk-gray-50);
  border: 1px solid var(--pk-gray-200);
  border-radius: 8px;
  height: 36px;
  margin-left: 8px;
}
.pk-search input {
  flex: 1;
  border: none;
  background: transparent;
  font: 13px 'Inter', sans-serif;
  color: var(--pk-gray-600);
  outline: none;
}
.pk-search input::placeholder { color: var(--pk-gray-400); }
.pk-kbd {
  font-size: 11px;
  color: var(--pk-gray-400);
  background: var(--pk-gray-100);
  border: 1px solid var(--pk-gray-300);
  border-radius: 4px;
  padding: 1px 5px;
}

.pk-header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.pk-bell {
  position: relative;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--pk-gray-500);
  padding: 4px;
  display: flex;
}
.pk-bell-badge {
  position: absolute;
  top: 0; right: 0;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--pk-red);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pk-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--pk-purple);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* ─── Page content ───────────────────────────────────────────────────── */
.pk-content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px;
  background: var(--pk-gray-50);
}

.pk-page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
}
.pk-page-title { font-size: 26px; font-weight: 700; color: var(--pk-gray-900); }
.pk-page-sub { font-size: 14px; color: var(--pk-gray-500); margin-top: 2px; }
.pk-page-actions { display: flex; gap: 8px; align-items: center; }

/* ─── Buttons ────────────────────────────────────────────────────────── */
.pk-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font: 600 13.5px 'Inter', sans-serif;
  cursor: pointer;
  border: none;
  transition: filter .12s;
}
.pk-btn:hover { filter: brightness(.95); }
.pk-btn-primary { background: var(--pk-green); color: #fff; }
.pk-btn-outline { background: #fff; border: 1px solid var(--pk-gray-300); color: var(--pk-gray-700); }
.pk-btn-sm { padding: 6px 12px; font-size: 12.5px; }

/* ─── Stat cards ─────────────────────────────────────────────────────── */
.pk-cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.pk-stat-card {
  border-radius: var(--radius-lg);
  padding: 22px 20px;
  position: relative;
  overflow: hidden;
}
.pk-stat-card.green  { background: var(--pk-green);  color: #fff; }
.pk-stat-card.blue   { background: var(--pk-blue);   color: #fff; }
.pk-stat-card.orange { background: var(--pk-orange); color: #fff; }
.pk-stat-card.red    { background: var(--pk-red);    color: #fff; }
.pk-stat-card.white  { background: #fff; color: var(--pk-gray-900); border: 1px solid var(--pk-gray-200); }
.pk-stat-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  opacity: .8;
  margin-bottom: 10px;
}
.pk-stat-value {
  font-size: 34px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 6px;
}
.pk-stat-value.red-num { color: var(--pk-red); }
.pk-stat-meta { font-size: 13px; opacity: .8; }
.pk-stat-icon {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255,255,255,.18);
  display: flex;
  align-items: center;
  justify-content: center;
}
.pk-stat-icon svg { width: 20px; height: 20px; opacity: .9; }
.pk-stat-card.white .pk-stat-icon { background: var(--pk-gray-100); }

/* ─── Panel / card ───────────────────────────────────────────────────── */
.pk-panel {
  background: #fff;
  border: 1px solid var(--pk-gray-200);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
}
.pk-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.pk-panel-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.pk-panel-sub { font-size: 13px; color: var(--pk-gray-500); }

/* ─── Two-col layout (dashboard) ─────────────────────────────────────── */
.pk-two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }

/* ─── Alert chips ────────────────────────────────────────────────────── */
.pk-alerts { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.pk-alert-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13.5px;
  font-weight: 600;
  border: 1px solid;
}
.pk-alert-chip.warn    { background: #fefce8; border-color: #fef08a; color: #854d0e; }
.pk-alert-chip.danger  { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
.pk-alert-chip.expiry  { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }

/* ─── Table ──────────────────────────────────────────────────────────── */
.pk-table-wrap { overflow-x: auto; }
.pk-table {
  width: 100%;
  border-collapse: collapse;
}
.pk-table th {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--pk-gray-500);
  text-align: left;
  padding: 10px 14px;
  border-bottom: 1px solid var(--pk-gray-200);
}
.pk-table td {
  padding: 14px 14px;
  border-bottom: 1px solid var(--pk-gray-100);
  color: var(--pk-gray-800, #1f2937);
  font-size: 13.5px;
}
.pk-table tr:last-child td { border-bottom: none; }
.pk-table tr:hover td { background: var(--pk-gray-50); }
.pk-table td.secondary { color: var(--pk-gray-400); font-size: 13px; }
.pk-table td.mono { font-family: monospace; font-size: 12px; color: var(--pk-gray-500); }

/* ─── Badges ─────────────────────────────────────────────────────────── */
.pk-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.pk-badge-green  { background: #dcfce7; color: #15803d; }
.pk-badge-orange { background: #fef3c7; color: #92400e; }
.pk-badge-red    { background: #fee2e2; color: #991b1b; }
.pk-badge-gray   { background: #374151; color: #fff; }
.pk-badge-blue   { background: #dbeafe; color: #1e40af; }

/* ─── Filter bar ─────────────────────────────────────────────────────── */
.pk-filter-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.pk-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--pk-gray-200);
  background: #fff;
  color: var(--pk-gray-600);
  transition: background .1s;
}
.pk-filter-chip:hover { background: var(--pk-gray-50); }
.pk-filter-chip.active { background: var(--pk-green); color: #fff; border-color: var(--pk-green); font-weight: 700; }
.pk-filter-count { font-size: 12px; font-weight: 700; }
.pk-filter-chip select {
  border: none;
  background: transparent;
  font: 13.5px 'Inter',sans-serif;
  color: var(--pk-gray-600);
  cursor: pointer;
  outline: none;
  padding-right: 4px;
}

/* ─── Search input ───────────────────────────────────────────────────── */
.pk-input-search {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: #fff;
  border: 1px solid var(--pk-gray-200);
  border-radius: var(--radius-sm);
  height: 40px;
}
.pk-input-search input {
  flex: 1;
  border: none;
  background: transparent;
  font: 13.5px 'Inter',sans-serif;
  color: var(--pk-gray-700);
  outline: none;
}
.pk-input-search input::placeholder { color: var(--pk-gray-400); }

.pk-input {
  border: 1px solid var(--pk-gray-200);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font: 13.5px 'Inter',sans-serif;
  color: var(--pk-gray-700);
  outline: none;
  width: 100%;
  background: #fff;
}
.pk-input:focus { border-color: var(--pk-green); box-shadow: 0 0 0 3px rgba(22,163,74,.12); }

/* ─── POS layout ─────────────────────────────────────────────────────── */
.pk-pos-layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 0;
  height: calc(100vh - 60px);
  overflow: hidden;
}
.pk-pos-left {
  padding: 24px 28px;
  overflow-y: auto;
  background: var(--pk-gray-50);
}
.pk-pos-right {
  background: #fff;
  border-left: 1px solid var(--pk-gray-200);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pk-quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.pk-quick-card {
  background: #fff;
  border: 1px solid var(--pk-gray-200);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  cursor: pointer;
  transition: border-color .12s, box-shadow .12s;
}
.pk-quick-card:hover { border-color: var(--pk-green); box-shadow: 0 0 0 2px rgba(22,163,74,.12); }
.pk-quick-card.low { border-color: var(--pk-orange); }
.pk-quick-name { font-size: 13px; font-weight: 600; color: var(--pk-gray-900); margin-bottom: 2px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-quick-generic { font-size: 12px; color: var(--pk-gray-400); margin-bottom: 8px; }
.pk-quick-bottom { display: flex; align-items: center; justify-content: space-between; }
.pk-quick-price { font-size: 15px; font-weight: 700; color: var(--pk-green); }
.pk-quick-qty { font-size: 12px; color: var(--pk-gray-500); }
.pk-quick-qty.low { color: var(--pk-orange); }

/* Cart panel */
.pk-cart-header { padding: 18px 18px 12px; border-bottom: 1px solid var(--pk-gray-100); }
.pk-cart-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.pk-cart-body { flex: 1; overflow-y: auto; padding: 12px 18px; }
.pk-cart-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 20px; color: var(--pk-gray-400); text-align: center; }
.pk-cart-empty svg { width: 44px; height: 44px; }
.pk-cart-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--pk-gray-100); }
.pk-cart-item-name { flex: 1; font-size: 13px; font-weight: 500; }
.pk-cart-item-qty { display: flex; align-items: center; gap: 6px; }
.pk-qty-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--pk-gray-300); background: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.pk-qty-btn:hover { background: var(--pk-gray-100); }
.pk-cart-item-price { font-size: 13px; font-weight: 600; color: var(--pk-gray-900); min-width: 52px; text-align: right; }

.pk-cart-footer { padding: 14px 18px; border-top: 1px solid var(--pk-gray-200); }
.pk-cart-totals { margin-bottom: 14px; }
.pk-total-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 14px; color: var(--pk-gray-600); }
.pk-total-row.grand { font-size: 17px; font-weight: 700; color: var(--pk-gray-900); padding-top: 8px; border-top: 1px solid var(--pk-gray-200); }
.pk-total-row.grand span:last-child { color: var(--pk-green); }

.pk-payment-label { font-size: 13px; font-weight: 600; color: var(--pk-gray-700); margin-bottom: 10px; }
.pk-payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.pk-payment-opt {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 12px;
  border: 1.5px solid var(--pk-gray-200);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--pk-gray-600);
  background: #fff;
  transition: all .12s;
}
.pk-payment-opt.selected { border-color: var(--pk-green); background: var(--pk-green-light); color: var(--pk-green-dark); }
.pk-process-btn {
  width: 100%;
  padding: 12px;
  background: var(--pk-green);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font: 700 14px 'Inter',sans-serif;
  cursor: pointer;
  transition: background .12s;
}
.pk-process-btn:hover { background: var(--pk-green-dark); }
.pk-process-btn:disabled { background: var(--pk-gray-300); cursor: not-allowed; }

/* ─── Empty state ────────────────────────────────────────────────────── */
.pk-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 60px 20px;
  color: var(--pk-gray-400);
  text-align: center;
}
.pk-empty svg { width: 48px; height: 48px; }
.pk-empty-title { font-size: 15px; font-weight: 600; color: var(--pk-gray-500); }
.pk-empty-sub { font-size: 13px; }

/* ─── Low-stock sidebar panel ────────────────────────────────────────── */
.pk-low-stock-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 0;
  border-bottom: 1px solid var(--pk-gray-100);
}
.pk-low-stock-item:last-child { border-bottom: none; }
.pk-low-stock-name { font-size: 13.5px; font-weight: 500; color: var(--pk-gray-900); }
.pk-low-stock-meta { font-size: 12px; color: var(--pk-gray-400); }
.pk-low-stock-right { text-align: right; }
.pk-zero-badge { font-size: 12px; font-weight: 700; color: var(--pk-red); }
.pk-order-link { font-size: 12px; color: var(--pk-green); cursor: pointer; font-weight: 600; }

/* ─── Reports ─────────────────────────────────────────────────────────── */
.pk-financial-section {
  background: #fff;
  border: 1px solid var(--pk-gray-200);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-bottom: 20px;
}
.pk-comparison-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 14px;
}
.pk-comp-card {
  border: 1px solid var(--pk-gray-200);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color .12s;
}
.pk-comp-card.active { border-color: var(--pk-green); background: #f0fdf4; }
.pk-comp-label { font-size: 13px; color: var(--pk-gray-500); margin-bottom: 4px; }
.pk-comp-value { font-size: 16px; font-weight: 700; color: var(--pk-green); }
.pk-comp-value.red { color: var(--pk-red); }

/* ─── Misc ───────────────────────────────────────────────────────────── */
.pk-more-btn { background: transparent; border: none; cursor: pointer; color: var(--pk-gray-400); padding: 4px; border-radius: 4px; }
.pk-more-btn:hover { background: var(--pk-gray-100); color: var(--pk-gray-700); }
.pk-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.pk-view-all { font-size: 13px; color: var(--pk-green); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.pk-divider { height: 1px; background: var(--pk-gray-100); margin: 6px 0; }
.pk-select {
  padding: 7px 12px;
  border: 1px solid var(--pk-gray-200);
  border-radius: var(--radius-sm);
  font: 13.5px 'Inter',sans-serif;
  color: var(--pk-gray-700);
  background: #fff;
  outline: none;
  cursor: pointer;
}

/* ─── Procurement / receipts placeholder ─────────────────────────────── */
.pk-coming-soon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 80px 40px;
  text-align: center;
  color: var(--pk-gray-500);
}

/* ─── FAB (floating action button) ──────────────────────────────────── */
.pk-fab {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--pk-green);
  color: #fff;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(22,163,74,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: background .12s;
}
.pk-fab:hover { background: var(--pk-green-dark); }

/* ─── Responsive tweaks ──────────────────────────────────────────────── */
@media (max-width: 1100px) {
  .pk-quick-grid { grid-template-columns: repeat(3, 1fr); }
  .pk-cards-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--pk-gray-200); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--pk-gray-300); }

    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="2" strokeLinecap="round"
         strokeLinejoin="round" className={className} style={style}>
      {paths[name]}
    </svg>
  );
}

function mapDateRangeToApi(dateRange) {
  if (dateRange === "7days") return "7d";
  if (dateRange === "30days") return "30d";
  return "all";
}

// pk-dashboard.jsx — PharmaKristo Dashboard page

function Dashboard({ onNav }) {
  const { dateRange, setDateRange } = useAppContext();
  const [summary, setSummary] = React.useState({
    total_revenue: 0,
    total_expenses: 0,
    gross_profit: 0,
    inventory_value: 0,
  });
  const [salesTrend, setSalesTrend] = React.useState([]);
  const [sales, setSales] = React.useState([]);
  const [lowStock, setLowStock] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState("");
  const fmt = (n) => n.toLocaleString("en-GH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const today = new Date().toISOString().slice(0, 10);
  const apiRange = mapDateRangeToApi(dateRange);

  React.useEffect(() => {
    const loadDashboard = async () => {
      setLoading(true);
      setError("");
      try {
        const [summaryRes, trendRes, salesRes, drugsRes] = await Promise.all([
          fetch(`/api/dashboard/summary?range=${encodeURIComponent(apiRange)}`),
          fetch(`/api/dashboard/sales-trend?range=${encodeURIComponent(apiRange)}`),
          fetch("/api/sales"),
          fetch("/api/drugs"),
        ]);
        if (!summaryRes.ok || !trendRes.ok || !salesRes.ok || !drugsRes.ok) {
          throw new Error("Unable to load dashboard analytics.");
        }
        const [summaryData, trendData, salesData, drugsData] = await Promise.all([
          summaryRes.json(),
          trendRes.json(),
          salesRes.json(),
          drugsRes.json(),
        ]);
        setSummary({
          total_revenue: Number(summaryData.total_revenue || 0),
          total_expenses: Number(summaryData.total_expenses || 0),
          gross_profit: Number(summaryData.gross_profit || 0),
          inventory_value: Number(summaryData.inventory_value || 0),
        });
        setSalesTrend(Array.isArray(trendData) ? trendData : []);
        setSales(Array.isArray(salesData) ? salesData : []);
        const lows = (Array.isArray(drugsData) ? drugsData : [])
          .filter((p) => p.qty <= p.min || p.status === "low_stock" || p.status === "out_stock")
          .slice(0, 6)
          .map((p) => ({ name: p.name, min: p.min, qty: p.qty }));
        setLowStock(lows);
      } catch (err) {
        setError(err.message || "Failed to load dashboard.");
      } finally {
        setLoading(false);
      }
    };
    loadDashboard();
  }, [apiRange]);

  const todaySales = sales.filter((s) => String(s.timestamp || "").slice(0, 10) === today);
  const dailyRevenue = todaySales.reduce((sum, s) => sum + Number(s.total_price || 0), 0);
  const dailyTxns = todaySales.length;
  const maxTrend = Math.max(1, ...salesTrend.map((p) => Number(p.revenue || 0)));

  if (loading) return <div className="pk-content"><div style={{ color:"#6b7280" }}>Loading dashboard analytics...</div></div>;
  if (error) return <div className="pk-content"><div style={{ color:"#dc2626" }}>{error}</div></div>;

  return (
    <div className="pk-content">
      <div className="pk-page-header">
        <div>
          <div className="pk-page-title">Dashboard</div>
          <div className="pk-page-sub">Overview of your pharmacy's performance today.</div>
        </div>
        <div className="pk-page-actions">
          <select className="pk-select" value={dateRange} onChange={(e) => setDateRange(e.target.value)}>
            <option value="7days">Last 7 days</option>
            <option value="30days">Last 30 days</option>
            <option value="all">All time</option>
          </select>
          <button className="pk-btn pk-btn-outline" onClick={() => onNav("reports")}>View Reports</button>
          <button className="pk-btn pk-btn-primary" onClick={() => onNav("sales")}>
            <Icon name="shopping-cart" size={16}/>
            New Sale
          </button>
        </div>
      </div>

      {/* Stat cards */}
      <div className="pk-cards-grid">
        <StatCard color="green"  label="Daily Sales"     value={`₵${fmt(dailyRevenue)}`}            meta={`${dailyTxns} transaction${dailyTxns !== 1 ? "s" : ""}`} icon="dollar-sign"/>
        <StatCard color="blue"   label="Revenue"         value={`₵${fmt(summary.total_revenue)}`}   meta={`Range: ${dateRange}`} icon="credit-card"/>
        <StatCard color="white"  label="Gross Profit"    value={`₵${fmt(summary.gross_profit)}`}    meta={`Expenses: ₵${fmt(summary.total_expenses)}`} icon="activity" redValue={summary.gross_profit < 0}/>
        <StatCard color="orange" label="Inventory Value" value={`₵${fmt(summary.inventory_value)}`} meta="Current stock value" icon="shopping-cart"/>
      </div>

      <div className="pk-panel" style={{ marginBottom:20 }}>
        <div className="pk-section-header">
          <div>
            <div className="pk-panel-title">Sales Trend</div>
            <div className="pk-panel-sub">Historical daily revenue</div>
          </div>
        </div>
        {salesTrend.length === 0 ? (
          <div className="pk-empty" style={{ padding:"24px 20px" }}>
            <div className="pk-empty-title">No trend data yet</div>
          </div>
        ) : (
          <div style={{ display:"grid", gap:8 }}>
            {salesTrend.map((point) => {
              const revenue = Number(point.revenue || 0);
              const width = Math.max(4, Math.round((revenue / maxTrend) * 100));
              return (
                <div key={point.date} style={{ display:"grid", gridTemplateColumns:"130px 1fr 120px", gap:10, alignItems:"center" }}>
                  <div className="secondary">{point.date}</div>
                  <div style={{ background:"#e5e7eb", borderRadius:8, height:10, overflow:"hidden" }}>
                    <div style={{ width:`${width}%`, height:"100%", background:"#2563eb" }} />
                  </div>
                  <div style={{ textAlign:"right", fontWeight:600 }}>₵{fmt(revenue)}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Two-column layout */}
      <div className="pk-two-col">
        {/* Recent Transactions */}
        <div className="pk-panel">
          <div className="pk-section-header">
            <div>
              <div className="pk-panel-title">
                <Icon name="shopping-cart" size={18} style={{ color:"#16a34a" }}/>
                Recent Transactions
              </div>
              <div className="pk-panel-sub" style={{ marginTop:3 }}>Latest sales activity from today</div>
            </div>
            <button className="pk-view-all" onClick={() => onNav("sales")}>
              View All <Icon name="arrow-up-right" size={14}/>
            </button>
          </div>
          {sales.length === 0 ? (
            <div className="pk-empty">
              <Icon name="shopping-cart"/>
              <div className="pk-empty-title">No sales recorded today</div>
              <div className="pk-empty-sub">Ready to process new customers</div>
            </div>
          ) : (
            <div className="pk-table-wrap">
              <table className="pk-table">
                <thead>
                  <tr>
                    <th>Receipt</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th>
                  </tr>
                </thead>
                <tbody>
                  {sales.slice(0, 4).map(s => (
                    <tr key={s.id}>
                      <td className="mono">S-{s.id}</td>
                      <td>{s.drug_name}</td>
                      <td className="secondary">{s.qty} unit{s.qty !== 1 ? "s" : ""}</td>
                      <td><strong>₵{fmt(Number(s.total_price || 0))}</strong></td>
                      <td><span className="pk-badge pk-badge-green">{String(s.timestamp || "").slice(0, 10)}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        {/* Low Stock */}
        <div className="pk-panel">
          <div className="pk-section-header">
            <div>
              <div className="pk-panel-title" style={{ color:"#d97706" }}>
                <Icon name="alert-triangle" size={18} style={{ color:"#d97706" }}/>
                Low Stock
              </div>
              <div className="pk-panel-sub" style={{ color:"#d97706", opacity:.8, marginTop:3 }}>Restock needed soon</div>
            </div>
            <button className="pk-more-btn"><Icon name="more-vertical" size={16}/></button>
          </div>
          {lowStock.map((item, i) => (
            <div key={i} className="pk-low-stock-item">
              <div>
                <div className="pk-low-stock-name">{item.name}</div>
                <div className="pk-low-stock-meta">Min Level: {item.min}</div>
              </div>
              <div className="pk-low-stock-right">
                <div className="pk-zero-badge">{item.qty} left</div>
                <div className="pk-order-link" onClick={() => onNav("procurement")}>Order</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { Dashboard });

// pk-products.jsx — PharmaKristo Products page

function Products() {
  const { userRole } = useAppContext();
  const { stats } = window.PKData;
  const emptyForm = { name:"", generic:"", batch:"", qty:"", min:"", expiry:"", cost:"", sell:"", supplier:"", status:"in_stock" };
  const [products, setProducts] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState("");
  const [filter, setFilter] = React.useState("all");
  const [query, setQuery]   = React.useState("");
  const [supplier, setSupplier] = React.useState("All Suppliers");
  const [showModal, setShowModal] = React.useState(false);
  const [editing, setEditing] = React.useState(null);
  const [formData, setFormData] = React.useState(emptyForm);

  const fmt = (n) => n.toLocaleString("en-GH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const loadProducts = React.useCallback(async () => {
    setLoading(true);
    setError("");
    try {
      const res = await fetch("/api/drugs");
      if (!res.ok) throw new Error("Failed to load products.");
      const data = await res.json();
      setProducts(data);
    } catch (err) {
      setError(err.message || "Unable to load products.");
    } finally {
      setLoading(false);
    }
  }, []);

  React.useEffect(() => {
    loadProducts();
  }, [loadProducts]);

  const suppliers = React.useMemo(() => {
    return ["All Suppliers", ...Array.from(new Set(products.map((p) => p.supplier))).sort()];
  }, [products]);

  const openCreateModal = () => {
    setEditing(null);
    setFormData(emptyForm);
    setShowModal(true);
  };

  const openEditModal = (product) => {
    setEditing(product);
    setFormData({
      name: product.name || "",
      generic: product.generic || "",
      batch: product.batch || "",
      qty: String(product.qty ?? ""),
      min: String(product.min ?? ""),
      expiry: product.expiry || "",
      cost: String(product.cost ?? ""),
      sell: String(product.sell ?? ""),
      supplier: product.supplier || "",
      status: product.status || "in_stock",
    });
    setShowModal(true);
  };

  const closeModal = () => {
    setShowModal(false);
    setEditing(null);
    setFormData(emptyForm);
  };

  const submitForm = async (e) => {
    e.preventDefault();
    const payload = {
      ...formData,
      qty: Number(formData.qty),
      min: Number(formData.min),
      cost: Number(formData.cost),
      sell: Number(formData.sell),
    };
    const method = editing ? "PUT" : "POST";
    const url = editing ? `/api/drugs/${editing.id}` : "/api/drugs";
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json", "X-User-Role": userRole || "" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const result = await res.json().catch(() => ({}));
      alert(result.error || "Could not save product.");
      return;
    }
    closeModal();
    loadProducts();
  };

  const removeProduct = async (product) => {
    if (!confirm(`Delete ${product.name}?`)) return;
    const res = await fetch(`/api/drugs/${product.id}`, { method: "DELETE", headers: { "X-User-Role": userRole || "" } });
    if (!res.ok) {
      alert("Could not delete product.");
      return;
    }
    loadProducts();
  };

  const filtered = React.useMemo(() => {
    let list = products;
    if (filter === "low")      list = list.filter(p => p.low || p.status === "low_stock");
    if (filter === "expiring") list = list.filter(p => p.expiring || p.status === "expiring_soon");
    if (filter === "expired")  list = list.filter(p => p.status === "expired");
    if (supplier !== "All Suppliers") list = list.filter(p => p.supplier === supplier);
    if (query) list = list.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || p.generic.toLowerCase().includes(query.toLowerCase()) || p.batch.toLowerCase().includes(query.toLowerCase()));
    return list;
  }, [filter, query, supplier]);

  const stockBadge = (p) => {
    if (p.status === "out_stock") return <span className="pk-badge pk-badge-red">Out of Stock</span>;
    if (p.status === "low_stock") return <><div style={{ fontWeight:700 }}>{p.qty}</div><span className="pk-badge pk-badge-orange">Low Stock</span></>;
    if (p.status === "expiring_soon") return <><div style={{ fontWeight:700 }}>{p.qty}</div><span className="pk-badge pk-badge-orange">Expiring</span></>;
    return <><div style={{ fontWeight:700 }}>{p.qty}</div><span className="pk-badge pk-badge-green">In Stock</span></>;
  };

  return (
    <div className="pk-content">
      <div className="pk-page-header">
        <div>
          <div className="pk-page-title">Products</div>
          <div className="pk-page-sub">Manage your product catalog and stock levels</div>
        </div>
        <button className="pk-btn pk-btn-primary" onClick={openCreateModal}>
          <Icon name="plus" size={16}/> Add Product
        </button>
      </div>

      {/* Stat cards */}
      <div className="pk-cards-grid">
        <StatCard color="blue"   label="Total Products"  value={stats.totalProducts} icon="columns"/>
        <StatCard color="orange" label="Low Stock"       value={stats.lowStock}      icon="alert-triangle"/>
        <StatCard color="red"    label="Expiring Soon"   value={stats.expiringSoon}  icon="calendar"/>
        <StatCard color="green"  label="Stock Value"     value={`₵${fmt(stats.stockValue)}`} icon="shopping-cart"/>
      </div>

      {/* Product list */}
      <div className="pk-panel">
        <div className="pk-section-header">
          <div>
            <div className="pk-panel-title">Product List</div>
            <div className="pk-panel-sub">{filtered.length} of {products.length} products</div>
          </div>
          <div className="pk-input-search" style={{ width:220 }}>
            <Icon name="search" size={15} style={{ color:"#9ca3af" }}/>
            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search products..."/>
          </div>
        </div>

        {/* Filters */}
        <div className="pk-filter-bar">
          <Icon name="filter" size={15} style={{ color:"#9ca3af" }}/>
          {[
            { id:"all",      label:"All" },
            { id:"low",      label:`Low Stock`, count:stats.lowStock },
            { id:"expiring", label:`Expiring Soon`, count:stats.expiringSoon },
            { id:"expired",  label:`Expired`, count:stats.expired },
          ].map(f => (
            <button key={f.id} className={"pk-filter-chip" + (filter === f.id ? " active" : "")} onClick={() => setFilter(f.id)}>
              {f.label}
              {f.count != null && <span className="pk-filter-count">{f.count}</span>}
            </button>
          ))}
          <div className="pk-filter-chip">
            <select value={supplier} onChange={e => setSupplier(e.target.value)}>
              {suppliers.map(s => <option key={s}>{s}</option>)}
            </select>
            <Icon name="chevron-down" size={13}/>
          </div>
        </div>

        {/* Table */}
        <div className="pk-table-wrap">
          <table className="pk-table">
            <thead>
              <tr>
                <th>Product</th><th>Generic</th><th>Batch</th>
                <th style={{ textAlign:"center" }}>Qty</th>
                <th>Expiry</th><th>Cost</th><th>Sell</th><th>Supplier</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(p => (
                <tr key={p.id + p.batch}>
                  <td><strong>{p.name}</strong></td>
                  <td className="secondary">{p.generic}</td>
                  <td className="mono">{p.batch}</td>
                  <td style={{ textAlign:"center" }}>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
                      {stockBadge(p)}
                    </div>
                  </td>
                  <td className="secondary">{p.expiry}</td>
                  <td>₵{fmt(p.cost)}</td>
                  <td><strong>₵{fmt(p.sell)}</strong></td>
                  <td className="secondary" style={{ maxWidth:160, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{p.supplier}</td>
                  <td style={{ whiteSpace:"nowrap" }}>
                    <button className="pk-btn pk-btn-outline pk-btn-sm" onClick={() => openEditModal(p)} style={{ marginRight:8 }}>Edit</button>
                    <button className="pk-btn pk-btn-sm" onClick={() => removeProduct(p)} style={{ background:"#dc2626", color:"#fff" }}>Delete</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtered.length === 0 && (
            <div className="pk-empty" style={{ padding:"32px 20px" }}>
              <Icon name="package"/>
              <div className="pk-empty-title">No products found</div>
              <div className="pk-empty-sub">Try adjusting your filters or search.</div>
            </div>
          )}
        </div>
      </div>
      {loading && <div style={{ marginTop:12, color:"#6b7280" }}>Loading products...</div>}
      {error && <div style={{ marginTop:12, color:"#dc2626" }}>{error}</div>}

      {showModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(17,24,39,.45)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000 }}>
          <form onSubmit={submitForm} className="pk-panel" style={{ width:"min(720px, 92vw)" }}>
            <div className="pk-panel-title" style={{ marginBottom:16 }}>{editing ? "Edit Product" : "Add Product"}</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
              <input className="pk-input" placeholder="Product name" value={formData.name} onChange={(e) => setFormData(v => ({ ...v, name:e.target.value }))} required />
              <input className="pk-input" placeholder="Generic name" value={formData.generic} onChange={(e) => setFormData(v => ({ ...v, generic:e.target.value }))} required />
              <input className="pk-input" placeholder="Batch" value={formData.batch} onChange={(e) => setFormData(v => ({ ...v, batch:e.target.value }))} required />
              <input className="pk-input" placeholder="Expiry e.g. Jan 20, 2029" value={formData.expiry} onChange={(e) => setFormData(v => ({ ...v, expiry:e.target.value }))} required />
              <input className="pk-input" type="number" min="0" placeholder="Quantity" value={formData.qty} onChange={(e) => setFormData(v => ({ ...v, qty:e.target.value }))} required />

function Sales() {
  const { userRole } = useAppContext();
  const [products, setProducts] = React.useState([]);
  const [sales, setSales] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [submitting, setSubmitting] = React.useState(false);
  const [error, setError] = React.useState("");
  const [query, setQuery] = React.useState("");
  const [cart, setCart] = React.useState([]);
  const [customer, setCustomer] = React.useState("");
  const [payment, setPayment] = React.useState("cash");

  const fmt = (n) => n.toLocaleString("en-GH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const loadProducts = React.useCallback(async () => {
    const res = await fetch("/api/drugs");
    if (!res.ok) throw new Error("Failed to fetch products");
    setProducts(await res.json());
  }, []);

  const loadSales = React.useCallback(async () => {
    const res = await fetch("/api/sales");
    if (!res.ok) throw new Error("Failed to fetch sales");
    setSales(await res.json());
  }, []);

  React.useEffect(() => {
    const loadAll = async () => {
      setLoading(true);
      setError("");
      try {
        await Promise.all([loadProducts(), loadSales()]);
      } catch (err) {
        setError(err.message || "Could not load sales data.");
      } finally {
        setLoading(false);
      }
    };
    loadAll();
  }, [loadProducts, loadSales]);

  const visible = React.useMemo(() => {
    const q = query.toLowerCase();
    return products
      .filter(p => p.status !== "out_stock")
      .filter(p => !q || p.name.toLowerCase().includes(q) || p.generic.toLowerCase().includes(q) || p.batch.toLowerCase().includes(q))
      .slice(0, 16);
  }, [products, query]);

  const addToCart = (product) => {
    setCart(prev => {
      const existing = prev.find(i => i.id === product.id);
      if (existing) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
      return [...prev, { ...product, qty: 1 }];
    });
  };

  const updateQty = (id, delta) => {
    setCart(prev => prev.map(i => i.id === id ? { ...i, qty: Math.max(0, i.qty + delta) } : i).filter(i => i.qty > 0));
  };

  const subtotal = cart.reduce((s, i) => s + i.sell * i.qty, 0);
  const paymentOpts = [
    { id:"cash", label:"Cash", icon:"dollar-sign" },
    { id:"momo", label:"Mobile Money", icon:"smartphone" },
    { id:"card", label:"Card", icon:"credit-card" },
    { id:"credit", label:"Credit", icon:"clock" },
  ];

  const processRef = async () => {
    if (cart.length === 0) return;
    setSubmitting(true);
    try {
      const res = await fetch("/api/sales", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          customer: customer || "Walk-in",
          payment,
          items: cart.map(item => ({
            drug_id: item.id,
            drug_name: item.name,
            qty: item.qty,
            total_price: Number((item.sell * item.qty).toFixed(2)),
          })),
        }),
      });
      if (!res.ok) {
        const result = await res.json().catch(() => ({}));
        throw new Error(result.error || "Could not process sale");
      }
      await Promise.all([loadSales(), loadProducts()]);
      setCart([]);
      setCustomer("");
    } catch (err) {
      alert(err.message || "Sale failed.");
    } finally {
      setSubmitting(false);
    }
  };

  const voidSale = async (saleId) => {
    if (!confirm("Void this sale entry?")) return;
    const res = await fetch(`/api/sales/${saleId}`, { method: "DELETE", headers: { "X-User-Role": userRole || "" } });
    if (!res.ok) {
      alert("Could not void sale.");
      return;
    }
    await Promise.all([loadSales(), loadProducts()]);
  };

  if (loading) return <div className="pk-content"><div style={{ color:"#6b7280" }}>Loading sales data...</div></div>;
  if (error) return <div className="pk-content"><div style={{ color:"#dc2626" }}>{error}</div></div>;

  return (
    <div className="pk-pos-layout">
      <div className="pk-pos-left">
        <div className="pk-page-header" style={{ marginBottom:18 }}>
          <div>
            <div className="pk-page-title">Point of Sale</div>
            <div className="pk-page-sub">Process sales and manage transactions</div>
          </div>
        </div>
        <div className="pk-input-search" style={{ marginBottom:20 }}>
          <Icon name="search" size={15} style={{ color:"#9ca3af" }}/>
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search products by name, generic name, or batch..."/>
        </div>
        <div>
          <div style={{ fontWeight:700, fontSize:16, marginBottom:4 }}>Quick Select</div>
          <div style={{ color:"#6b7280", fontSize:13, marginBottom:14 }}>Click to add to cart</div>
          <div className="pk-quick-grid">
            {visible.map(p => (
              <div key={p.id + p.batch} className={"pk-quick-card" + (p.low ? " low" : "")} onClick={() => addToCart(p)}>
                <div className="pk-quick-name">{p.name}</div>
                <div className="pk-quick-generic">{p.generic}</div>
                <div className="pk-quick-bottom">
                  <div className="pk-quick-price">₵{p.sell.toFixed(2)}</div>
                  <div className={"pk-quick-qty" + (p.low ? " low" : "")}>{p.qty} left</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="pk-panel" style={{ marginTop:20 }}>
          <div className="pk-panel-title" style={{ marginBottom:12 }}>Recent Sales</div>
          <div className="pk-table-wrap">
            <table className="pk-table">
              <thead><tr><th>Time</th><th>Drug</th><th>Qty</th><th>Total</th><th></th></tr></thead>
              <tbody>
                {sales.slice(0, 8).map(s => (
                  <tr key={s.id}>
                    <td className="secondary" style={{ whiteSpace:"nowrap" }}>{new Date(s.timestamp).toLocaleString()}</td>
                    <td>{s.drug_name}</td>
                    <td>{s.qty}</td>
                    <td>₵{fmt(Number(s.total_price || 0))}</td>
                    <td><button className="pk-btn pk-btn-sm" style={{ background:"#dc2626", color:"#fff" }} onClick={() => voidSale(s.id)}>Void</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div className="pk-pos-right">
        <div className="pk-cart-header">
          <div className="pk-cart-title"><Icon name="shopping-cart" size={18} style={{ color:"#16a34a" }}/>Current Sale</div>
          <div style={{ marginTop:10 }}>
            <input className="pk-input" value={customer} onChange={e => setCustomer(e.target.value)} placeholder="Customer name (optional)" style={{ fontSize:13 }}/>
          </div>
        </div>
        <div className="pk-cart-body">
          {cart.length === 0 ? (
            <div className="pk-cart-empty">
              <Icon name="shopping-cart" style={{ width:44, height:44, color:"#d1d5db" }}/>
              <div style={{ fontSize:14, fontWeight:600, color:"#6b7280" }}>No items in cart</div>
              <div style={{ fontSize:12.5 }}>Search for products to add</div>
            </div>
          ) : cart.map(item => (
            <div key={item.id + item.batch} className="pk-cart-item">
              <div className="pk-cart-item-name">{item.name}<div style={{ fontSize:12, color:"#9ca3af" }}>{item.generic}</div></div>
              <div className="pk-cart-item-qty">
                <button className="pk-qty-btn" onClick={() => updateQty(item.id, -1)}>−</button>
                <span style={{ fontSize:14, fontWeight:600, minWidth:20, textAlign:"center" }}>{item.qty}</span>
                <button className="pk-qty-btn" onClick={() => updateQty(item.id, 1)}>+</button>
              </div>
              <div className="pk-cart-item-price">₵{fmt(item.sell * item.qty)}</div>
            </div>
          ))}
        </div>
        <div className="pk-cart-footer">
          <div className="pk-cart-totals">
            <div className="pk-total-row"><span>Subtotal</span><span>₵{fmt(subtotal)}</span></div>
            <div className="pk-total-row grand"><span>Total</span><span>₵{fmt(subtotal)}</span></div>
          </div>
          <div className="pk-payment-label">Payment Method</div>
          <div className="pk-payment-grid">
            {paymentOpts.map(opt => (
              <button key={opt.id} className={"pk-payment-opt" + (payment === opt.id ? " selected" : "")} onClick={() => setPayment(opt.id)}>
                <Icon name={opt.icon} size={15}/>{opt.label}
              </button>
            ))}
          </div>
          <button className="pk-process-btn" onClick={processRef} disabled={cart.length === 0 || submitting}>
            {submitting ? "Processing..." : (cart.length === 0 ? "Add items to process sale" : `Process Sale — ₵${fmt(subtotal)}`)}
          </button>
        </div>
      </div>
    </div>
  );
}

  }, []);

  React.useEffect(() => {
    const run = async () => {
      setLoading(true);
      try {
        await loadExpenses();

        setError(err.message || "Unable to load expenses.");
      } finally {
        setLoading(false);
      }

      setNewExp({ description:"", category:"Salaries", amount:"" });

  if (error) return <div className="pk-content"><div style={{ color:"#dc2626" }}>{error}</div></div>;

                placeholder="e.g. Supplier payment"/>

            <div>
              <div style={{ fontSize:12, fontWeight:600, color:"#6b7280", marginBottom:5 }}>CATEGORY</div>
              <select className="pk-select" style={{ width:"100%" }} value={newExp.category}

                {expenseCategories.slice(1).map(c => <option key={c}>{c}</option>)}

            </div>
            <div>
              <div style={{ fontSize:12, fontWeight:600, color:"#6b7280", marginBottom:5 }}>AMOUNT (₵)</div>
              <input className="pk-input" type="number" value={newExp.amount}
                onChange={e => setNewExp(v => ({ ...v, amount:e.target.value }))}
                placeholder="0.00"/>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button className="pk-btn pk-btn-primary" onClick={addExpense} disabled={saving}>{saving ? "Saving..." : "Save"}</button>
              <button className="pk-btn pk-btn-outline" onClick={() => setShowAdd(false)}>Cancel</button>
            </div>

        </div>

      {/* Summary cards */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:16, marginBottom:24 }}>

          <select className="pk-select" value={dateRange} onChange={e => setDateRange(e.target.value)}>
            <option value="7days">Last 7 days</option>
            <option value="30days">Last 30 days</option>
            <option value="all">All time</option>
          </select>
        </div>

        {/* 4 KPI cards */}
        <div className="pk-cards-grid" style={{ marginBottom:0 }}>
          <div className="pk-panel" style={{ background:"#f0fdf4", borderColor:"#bbf7d0" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8, color:"#16a34a" }}>
              <Icon name="shopping-cart" size={16}/> Sales
            </div>
            <div style={{ fontSize:28, fontWeight:800, color:"#16a34a" }}>{salesTrend.length}</div>
            <div style={{ fontSize:13, color:"#6b7280", marginTop:4 }}>{dateRange}</div>
          </div>
          <div className="pk-panel" style={{ background:"#eff6ff", borderColor:"#bfdbfe" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8, color:"#2563eb" }}>
              <Icon name="credit-card" size={16}/> Revenue
            </div>
            <div style={{ fontSize:28, fontWeight:800, color:"#2563eb" }}>₵{fmt(summary.total_revenue)}</div>
            <div style={{ fontSize:13, color:"#6b7280", marginTop:4 }}>{dateRange}</div>
          </div>
          <div className="pk-panel" style={{ background:"#fefce8", borderColor:"#fef08a" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8, color:"#b45309" }}>
              <Icon name="trending-up" size={16}/> Expenses
            </div>
            <div style={{ fontSize:28, fontWeight:800, color:"#b45309" }}>₵{fmt(summary.total_expenses)}</div>
            <div style={{ fontSize:13, color:"#6b7280", marginTop:4 }}>{dateRange}</div>
          </div>
          <div className="pk-panel" style={{ background:"#fff1f2", borderColor:"#fecdd3" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8, color:"#dc2626" }}>
              <Icon name="dollar-sign" size={16}/> Net Profit
            </div>
            <div style={{ fontSize:28, fontWeight:800, color:"#dc2626" }}>₵{fmt(summary.gross_profit)}</div>
            <div style={{ fontSize:13, color:"#6b7280", marginTop:4 }}>{dateRange}</div>
          </div>
        </div>

        <div style={{ marginTop:20 }}>
          <div style={{ fontSize:15, fontWeight:700, marginBottom:10 }}>Sales Trend</div>
          {salesTrend.length === 0 ? (
            <div className="pk-empty" style={{ padding:"20px 16px" }}>
              <div className="pk-empty-title">No trend data in this range</div>
            </div>
          ) : (
            <div style={{ display:"grid", gap:8 }}>
              {salesTrend.map((point) => {
                const revenue = Number(point.revenue || 0);
                const width = Math.max(4, Math.round((revenue / maxTrend) * 100));
                return (
                  <div key={point.date} style={{ display:"grid", gridTemplateColumns:"130px 1fr 120px", gap:10, alignItems:"center" }}>
                    <div className="secondary">{point.date}</div>
                    <div style={{ background:"#e5e7eb", borderRadius:8, height:10, overflow:"hidden" }}>
                      <div style={{ width:`${width}%`, height:"100%", background:"#16a34a" }} />
                    </div>
                    <div style={{ textAlign:"right", fontWeight:600 }}>₵{fmt(revenue)}</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Quick comparison */}
        <div style={{ marginTop:24 }}>
          <div style={{ fontSize:15, fontWeight:700, marginBottom:14 }}>Quick Comparison</div>
          <div className="pk-comparison-grid">
            {Object.entries(comparison).map(([key, val]) => (
              <div key={key}
                className={"pk-comp-card" + (compTab === key ? " active" : "")}
                onClick={() => setCompTab(key)}>
                <div className="pk-comp-label" style={{ textTransform:"capitalize" }}>{key}</div>
                <div className={"pk-comp-value" + (val.red ? " red" : "")}>{val.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Big colored summary cards (bottom) */}
      <div className="pk-cards-grid">
        <StatCard color="green"  label="Range Revenue"  value={`₵${fmt(summary.total_revenue)}`} meta={dateRange} icon="shopping-cart"/>
        <StatCard color="blue"   label="Range Expenses" value={`₵${fmt(summary.total_expenses)}`} meta={dateRange} icon="shopping-cart"/>
        <StatCard color="white"  label="Gross Profit"   value={`₵${fmt(summary.gross_profit)}`}   meta={dateRange} icon="activity"/>
        <StatCard color="orange" label="Inventory"      value={`₵${fmt(summary.inventory_value)}`} meta="Current valuation" icon="dollar-sign"/>
      </div>
    </div>
  );
}

Object.assign(window, { Reports });

// pk-main.jsx — PharmaKristo app router + mount

const { useState } = React;

function PlaceholderPage({ title, sub }) {
  return (
    <div className="pk-content">
      <div className="pk-page-header">
        <div>
          <div className="pk-page-title">{title}</div>
          <div className="pk-page-sub">{sub}</div>
        </div>
      </div>
      <div className="pk-coming-soon">
        <Icon name="settings" size={48} style={{ color:"#d1d5db" }}/>
        <div style={{ fontSize:18, fontWeight:600, color:"#6b7280" }}>{title}</div>
        <div style={{ color:"#9ca3af" }}>This section is available in the full Python build.</div>
        <div style={{ color:"#9ca3af", fontSize:12 }}>Run the Flask app to access this feature.</div>
      </div>
    </div>
  );
}

function App() {
  const { user, setUser, setUserRole } = useAppContext();
  const [page, setPage]     = useState("dashboard");
  const [search, setSearch] = useState("");

  const renderPage = () => {
    switch (page) {
      case "dashboard":   return <Dashboard onNav={setPage}/>;
      case "products":    return <Products/>;
      case "sales":       return <Sales/>;
      case "expenses":    return <Expenses/>;
      case "reports":     return <Reports/>;
      case "procurement": return <PlaceholderPage title="Procurement" sub="Manage purchase orders and suppliers"/>;
      case "receipts":    return <PlaceholderPage title="Receipts"    sub="View and print transaction receipts"/>;
      case "staff":       return <PlaceholderPage title="Staff"       sub="Manage pharmacy staff and roles"/>;
      case "settings":    return <PlaceholderPage title="Settings"    sub="Configure your pharmacy settings"/>;
      default:            return <Dashboard onNav={setPage}/>;
    }
  };

  if (!user) return <Login/>;

  return (
    <div className="pk-app">
      <Sidebar page={page} onNav={setPage} onLogout={() => { setUser(null); setUserRole(null); }}/>
      <div className="pk-main">
        <Header searchQuery={search} onSearch={setSearch}/>
        {renderPage()}
      </div>
      {/* FAB for quick sale */}
      {page !== "sales" && (
        <button className="pk-fab" onClick={() => setPage("sales")} title="New Sale">
          <Icon name="shopping-cart" size={22}/>
        </button>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <AppContextProvider>
    <App/>
  </AppContextProvider>
);

  </script>
</body>
