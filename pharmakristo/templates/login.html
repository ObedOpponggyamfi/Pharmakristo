<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PharmaKristo — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="pk-auth-page">
  <div class="pk-auth-card">
    <div class="pk-auth-logo" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
        <rect x="17" y="8" width="6" height="24" rx="2" fill="white"/>
        <rect x="8" y="17" width="24" height="6" rx="2" fill="white"/>
      </svg>
    </div>
    <h1 class="pk-auth-title">PharmaKristo</h1>
    <p class="pk-auth-sub">Sign in to manage your pharmacy</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        {% if category == 'error' %}
          <div class="pk-auth-error" role="alert">{{ msg }}</div>
        {% endif %}
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}" novalidate>
      <div class="pk-auth-field">
        <label class="pk-auth-label" for="email">Email or username</label>
        <input id="email" name="email" type="text" required autofocus
               autocomplete="username"
               class="pk-auth-input" value="{{ email or '' }}"
               placeholder="admin"/>
      </div>
      <div class="pk-auth-field">
        <label class="pk-auth-label" for="password">Password</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password"
               class="pk-auth-input" placeholder="Your password"/>
      </div>
      <button type="submit" class="pk-auth-btn">Sign In</button>
    </form>

    <p class="pk-auth-hint">Demo: admin / 12345 · cashier1 / 12345</p>
  </div>
</body>
</html>
